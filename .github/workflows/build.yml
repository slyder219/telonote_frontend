name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      # Mojibake guard: a file re-saved in the wrong encoding turns — into "â" (shipped once in a page title).
      - run: "! grep -rnE 'Â|Ã|â' src index.html"
      - run: npm run build
